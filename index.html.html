  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\"><\u002Fpath>\n<line x1=\"60\" y1=\"38\" x2=\"60\" y2=\"22\" stroke=\"#1F2A44\" stroke-width=\"3\"><\u002Fline><circle cx=\"60\" cy=\"19\" r=\"6\" fill=\"#FFC93C\" class=\"pulse\"><\u002Fcircle>\n<\u002Fg>\n<\u002Fdefs>\n<\u002Fsvg>\n\n<header style=\"display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-bottom:3px solid #1F2A44;background:#FFC93C\">\n<div style=\"font-family:'Baloo 2',sans-serif;font-weight:800;font-size:24px\">Educação Cidadã<\u002Fdiv>\n<nav style=\"display:flex;flex-wrap:wrap;gap:6px 20px;font-weight:800;font-size:15px\">\n<a href=\"#quadrinhos\" style=\"color:#1F2A44\">Quadrinhos<\u002Fa>\n<a href=\"#comparativo\" style=\"color:#1F2A44\">Lei de hoje x projeto<\u002Fa>\n<a href=\"#para-quem\" style=\"color:#1F2A44\">Para quem<\u002Fa>\n<a href=\"#mitos\" style=\"color:#1F2A44\">Mito ou fato<\u002Fa>\n<a href=\"#texto\" style=\"color:#1F2A44\">Texto da lei<\u002Fa>\n<a href=\"#plenario\" style=\"color:#1F2A44\">Para o plenário<\u002Fa>\n<\u002Fnav>\n<\u002Fheader>\n\n<section style=\"padding:44px 24px 36px\">\n<div style=\"max-width:1160px;margin:0 auto;display:flex;flex-wrap:wrap;gap:32px;align-items:center\">\n<div style=\"flex:1 1 420px;min-width:0\">\n<div style=\"display:inline-block;background:#fff;border:3px solid #1F2A44;border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;margin-bottom:18px\">Rascunho de projeto de lei, ainda sem número. Não é lei.<\u002Fdiv>\n<h1 style=\"margin:0 0 16px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:56px;line-height:1.02\">O que o projeto propõe e o que a lei já diz hoje<\u002Fh1>\n<p style=\"margin:0 0 24px;font-size:20px;line-height:1.5;max-width:560px\">Um guia em quadrinhos para entender, comparar e debater o Projeto de Lei da Política Nacional de Educação Cidadã Tridimensional, capítulo por capítulo.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n<a href=\"#quadrinhos\" style=\"display:inline-block;background:#1F2A44;color:#fff;font-weight:800;font-size:17px;padding:14px 26px;border-radius:14px;text-decoration:none;box-shadow:4px 4px 0 #FF6B57\">Ler os quadrinhos<\u002Fa>\n<a href=\"#texto\" style=\"display:inline-block;background:#fff;color:#1F2A44;font-weight:800;font-size:17px;padding:14px 26px;border-radius:14px;text-decoration:none;border:3px solid #1F2A44\">Ver o texto da lei<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 420px;min-width:0\">\n<svg sc-camel-view-box=\"0 0 520 400\" role=\"img\" aria-label=\"A professora Lia, Seu Zé, a estudante Duda e o robô Bit acenando\" style=\"width:100%;height:auto;display:block\">\n<circle cx=\"260\" cy=\"230\" r=\"170\" fill=\"#FFE29A\"><\u002Fcircle>\n<circle cx=\"430\" cy=\"90\" r=\"46\" fill=\"#FFC93C\" class=\"pulse\"><\u002Fcircle>\n<g class=\"floaty\"><path d=\"M60 250 l6 14 15 2 -11 10 3 15 -13 -8 -13 8 3 -15 -11 -10 15 -2z\" fill=\"#FF6B57\" stroke=\"#1F2A44\" stroke-width=\"3\"><\u002Fpath><\u002Fg>\n<g class=\"floaty2\"><rect x=\"448\" y=\"200\" width=\"40\" height=\"30\" rx=\"4\" fill=\"#3D5AFE\" stroke=\"#1F2A44\" stroke-width=\"3\"><\u002Frect><rect x=\"456\" y=\"206\" width=\"24\" height=\"4\" fill=\"#fff\"><\u002Frect><rect x=\"456\" y=\"214\" width=\"16\" height=\"4\" fill=\"#fff\"><\u002Frect><\u002Fg>\n<g class=\"pop\"><rect x=\"40\" y=\"26\" width=\"236\" height=\"68\" rx=\"20\" fill=\"#fff\" stroke=\"#1F2A44\" stroke-width=\"4\"><\u002Frect><path d=\"M96 94 L84 124 L126 94Z\" fill=\"#fff\" stroke=\"#1F2A44\" stroke-width=\"4\" stroke-linejoin=\"round\"><\u002Fpath><rect x=\"92\" y=\"90\" width=\"38\" height=\"8\" fill=\"#fff\"><\u002Frect><text x=\"158\" y=\"58\" text-anchor=\"middle\" font-family=\"'Baloo 2',sans-serif\" font-weight=\"800\" font-size=\"22\" fill=\"#1F2A44\">Vamos entender<\u002Ftext><text x=\"158\" y=\"82\" text-anchor=\"middle\" font-family=\"'Baloo 2',sans-serif\" font-weight=\"800\" font-size=\"22\" fill=\"#1F2A44\">a lei juntos?<\u002Ftext><\u002Fg>\n<ellipse cx=\"260\" cy=\"352\" rx=\"230\" ry=\"10\" fill=\"#1F2A44\" opacity=\".1\"><\u002Fellipse>\n<g class=\"bob\"><use href=\"#lia\" transform=\"translate(30 170) scale(1.2)\"><\u002Fuse><\u002Fg>\n<g class=\"bob2\"><use href=\"#ze\" transform=\"translate(150 185) scale(1.1)\"><\u002Fuse><\u002Fg>\n<g class=\"bob3\"><use href=\"#duda\" transform=\"translate(268 207) scale(.95)\"><\u002Fuse><\u002Fg>\n<g class=\"bob\"><use href=\"#bit\" transform=\"translate(378 200)\"><\u002Fuse><\u002Fg>\n<\u002Fsvg>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:8px 24px 40px\">\n<div style=\"max-width:1160px;margin:0 auto\">\n<h2 style=\"margin:0 0 18px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:34px\">O projeto em um minuto<\u002Fh2>\n<div style=\"display:flex;flex-wrap:wrap;gap:16px\">\n<div style=\"flex:1 1 190px;background:#fff;border:3px solid #1F2A44;border-radius:18px;padding:16px\"><div style=\"width:36px;height:36px;border-radius:50%;background:#FFC93C;border:3px solid #1F2A44;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;margin-bottom:8px\">1<\u002Fdiv><div style=\"font-weight:800;font-size:17px;margin-bottom:4px\">Princípios<\u002Fdiv><div style=\"font-size:15px;line-height:1.45\">Cidadão no centro, serviço público eficiente e escola sem proselitismo.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 190px;background:#fff;border:3px solid #1F2A44;border-radius:18px;padding:16px\"><div style=\"width:36px;height:36px;border-radius:50%;background:#7CE0D8;border:3px solid #1F2A44;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;margin-bottom:8px\">2<\u002Fdiv><div style=\"font-weight:800;font-size:17px;margin-bottom:4px\">Inteligência cívica<\u002Fdiv><div style=\"font-size:15px;line-height:1.45\">Orçamento, controle social e checagem de fontes entram no currículo.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 190px;background:#fff;border:3px solid #1F2A44;border-radius:18px;padding:16px\"><div style=\"width:36px;height:36px;border-radius:50%;background:#FF8A7A;border:3px solid #1F2A44;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;margin-bottom:8px\">3<\u002Fdiv><div style=\"font-weight:800;font-size:17px;margin-bottom:4px\">Alto rendimento<\u002Fdiv><div style=\"font-size:15px;line-height:1.45\">Tempo integral, olimpíadas e apoio (PSAR-BR) para estudantes de baixa renda.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 190px;background:#fff;border:3px solid #1F2A44;border-radius:18px;padding:16px\"><div style=\"width:36px;height:36px;border-radius:50%;background:#B9C4FF;border:3px solid #1F2A44;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;margin-bottom:8px\">4<\u002Fdiv><div style=\"font-weight:800;font-size:17px;margin-bottom:4px\">Docentes<\u002Fdiv><div style=\"font-size:15px;line-height:1.45\">Atualização contínua obrigatória e adicionais por desempenho.<\u002Fdiv><\u002Fdiv>\n<div style=\"flex:1 1 190px;background:#fff;border:3px solid #1F2A44;border-radius:18px;padding:16px\"><div style=\"width:36px;height:36px;border-radius:50%;background:#A8E6A1;border:3px solid #1F2A44;display:flex;align-items:center;justify-content:center;font-family:'Baloo 2',sans-serif;font-weight:800;margin-bottom:8px\">5<\u002Fdiv><div style=\"font-weight:800;font-size:17px;margin-bottom:4px\">Colaboração<\u002Fdiv><div style=\"font-size:15px;line-height:1.45\">União, estados e municípios implementam juntos, de forma progressiva.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"quadrinhos\" style=\"padding:40px 24px 24px;background:#FFEBB8;border-top:3px solid #1F2A44;border-bottom:3px solid #1F2A44\">\n<div style=\"max-width:1160px;margin:0 auto\">\n<h2 style=\"margin:0 0 6px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:38px\">Leia em quadrinhos<\u002Fh2>\n<p style=\"margin:0 0 36px;font-size:18px;line-height:1.5;max-width:720px\">Cinco histórias curtas, uma para cada capítulo do projeto. Os personagens são fictícios e as falas resumem o que o texto diz e o que a legislação atual já prevê. Toque em “Ouvir” para escutar as falas em português do Brasil. A voz vem do seu aparelho ou navegador.<\u002Fp>\n\n<sc-for list=\"{{eps}}\" as=\"e\" hint-placeholder-count=\"5\">\n<article style=\"margin-bottom:56px\">\n<div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px\">\n<div style=\"width:52px;height:52px;border-radius:50%;background:#1F2A44;color:#FFC93C;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center\">{{e.num}}<\u002Fdiv>\n<div>\n<div style=\"font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#0F5F5A\">{{e.cap}}<\u002Fdiv>\n<h3 style=\"margin:0;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:32px;line-height:1.1\">{{e.name}}<\u002Fh3>\n<\u002Fdiv>\n<div style=\"margin-left:auto;display:flex;flex-wrap:wrap;gap:8px\">\n<button sc-camel-on-click=\"{{e.play}}\" style=\"background:#1F2A44;color:#fff;border:0;border-radius:12px;font-weight:800;font-size:15px;padding:10px 18px;min-height:44px\">Ouvir a história toda<\u002Fbutton>\n<button sc-camel-on-click=\"{{e.stop}}\" style=\"background:#fff;color:#1F2A44;border:3px solid #1F2A44;border-radius:12px;font-weight:800;font-size:15px;padding:8px 16px;min-height:44px\">Parar<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border:4px solid #1F2A44;border-radius:6px;background:#fff;overflow:hidden;box-shadow:7px 7px 0 #1F2A44;margin-bottom:22px\">\n<div style=\"background:{{e.first.bg}};padding:16px 18px 18px\">\n<div style=\"display:inline-block;background:{{e.first.tagBg}};color:{{e.first.tagFg}};font-weight:800;font-size:13px;padding:3px 12px;border-radius:999px;border:2px solid #1F2A44;margin-bottom:8px\">{{e.first.name}}<\u0 ss=\"bob\"><use href=\"#lia\" transform=\"translate(100 38) scale(.8)\"><\u002Fuse><\u002Fg><\u002Fsc-if>\n<sc-if value=\"{{p.isZe}}\" hint-placeholder-val=\"{{false}}\"><g class=\"bob\"><use href=\"#ze\" transform=\"translate(100 38) scale(.8)\"><\u002Fuse><\u002Fg><\u002Fsc-if>\n<sc-if value=\"{{p.isDuda}}\" hint-placeholder-val=\"{{false}}\"><g class=\"bob\"><use href=\"#duda\" transform=\"translate(100 38) scale(.8)\"><\u002Fuse><\u002Fg><\u002Fsc-if>\n<sc-if value=\"{{p.isBit}}\" hint-placeholder-val=\"{{false}}\"><g class=\"bob\"><use href=\"#bit\" transform=\"translate(100 38) scale(.8)\"><\u002Fuse><\u002Fg><\u002Fsc-if>\n<\u002Fsvg>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"comparativo\" style=\"padding:48px 24px\">\n<div style=\"max-width:1160px;margin:0 auto\">\n<h2 style=\"margin:0 0 6px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:38px\">Lei de hoje x projeto, capítulo por capítulo<\u002Fh2>\n<p style=\"margin:0 0 28px;font-size:18px;line-height:1.5;max-width:760px\">Boa parte do que o projeto toca já existe em alguma forma. Aqui está o que a legislação atual diz, o que o texto novo propõe e onde há debate legítimo.<\u002Fp>\n<sc-for list=\"{{chapters}}\" as=\"c\" hint-placeholder-count=\"5\">\n<article style=\"background:#fff;border:3px solid #1F2A44;border-radius:20px;padding:22px;margin-bottom:26px;box-shadow:{{c.shadow}}\">\n<div style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:14px\">\n<h3 style=\"margin:0;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:26px\">{{c.num}}. {{c.title}}<\u002Fh3>\n<span style=\"font-size:14px;font-weight:800;color:#5A6482\">{{c.arts}}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:18px\">\n<div style=\"flex:1 1 260px;min-width:0\"><div style=\"display:inline-block;background:#DCEFFB;font-weight:800;font-size:13px;padding:3px 12px;border-radius:999px;margin-bottom:8px\">O que já existe hoje<\u002Fdiv><p style=\"margin:0;font-size:16px;line-height:1.55\">{{c.hoje}}<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 260px;min-width:0\"><div style=\"display:inline-block;background:#FFE29A;font-weight:800;font-size:13px;padding:3px 12px;border-radius:999px;margin-bottom:8px\">O que o projeto propõe<\u002Fdiv><p style=\"margin:0;font-size:16px;line-height:1.55\">{{c.propoe}}<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 260px;min-width:0\"><div style=\"display:inline-block;background:#FFD3CC;font-weight:800;font-size:13px;padding:3px 12px;border-radius:999px;margin-bottom:8px\">Pontos em debate<\u002Fdiv><p style=\"margin:0 0 8px;font-size:16px;line-height:1.55\"><strong>Quem apoia:<\u002Fstrong> {{c.apoia}}<\u002Fp><p style=\"margin:0;font-size:16px;line-height:1.55\"><strong>Quem questiona:<\u002Fstrong> {{c.questiona}}<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:14px;padding-top:12px;border-top:2px dashed #D9C9A8;font-size:14px;display:flex;flex-wrap:wrap;gap:6px 16px\">\n<span style=\"font-weight:800\">Fontes:<\u002Fspan>\n<sc-for list=\"{{c.sources}}\" as=\"s\" hint-placeholder-count=\"2\"><a href=\"{{s.url}}\" target=\"_blank\" rel=\"noopener\">{{s.label}}<\u002Fa><\u002Fsc-for>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"para-quem\" style=\"padding:48px 24px;background:#DDF3F0;border-top:3px solid #1F2A44;border-bottom:3px solid #1F2A44\">\n<div style=\"max-width:1160px;margin:0 auto\">\n<h2 style=\"margin:0 0 6px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:38px\">E para mim, o que muda?<\u002Fh2>\n<p style=\"margin:0 0 28px;font-size:18px;line-height:1.5;max-width:760px\">O que o projeto propõe para cada pessoa e do que isso ainda depende para sair do papel.<\u002Fp>\n<div style=\"display:flex;flex-wrap:wrap;gap:20px\">\n<div style=\"flex:1 1 250px;min-width:0;background:#fff;border:3px solid #1F2A44;border-radius:20px;overflow:hidden\">\n<svg sc-camel-view-box=\"0 0 250 150\" role=\"img\" aria-label=\"Duda, estudante\" style=\"display:block;width:100%;height:auto;background:#FFE9A8\"><g class=\"bob\"><use href=\"#duda\" transform=\"translate(65 14) scale(.9)\"><\u002Fuse><\u002Fg><\u002Fsvg>\n<div style=\"padding:16px\"><h3 style=\"margin:0 0 8px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px\">Estudantes<\u002Fh3><p style=\"margin:0 0 8px;font-size:15px;line-height:1.5\"><strong>Propõe:<\u002Fstrong> aulas práticas sobre orçamento e checagem de fontes, tempo integral, tutoria e isenção de taxas para quem tem baixa renda, iniciação científica júnior.<\u002Fp><p style=\"margin:0;font-size:15px;line-height:1.5\"><strong>Depende de:<\u002Fstrong> recursos, vagas e de cada rede de ensino adotar as medidas.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 250px;min-width:0;background:#fff;border:3px solid #1F2A44;border-radius:20px;overflow:hidden\">\n<svg sc-camel-view-box=\"0 0 250 150\" role=\"img\" aria-label=\"Seu Zé, representando as famílias\" style=\"display:block;width:100%;height:auto;background:#FFD3CC\"><g class=\"bob\"><use href=\"#ze\" transform=\"translate(65 14) scale(.9)\"><\u002Fuse><\u002Fg><\u002Fsvg>\n<div style=\"padding:16px\"><h3 style=\"margin:0 0 8px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px\">Famílias<\u002Fh3><p style=\"margin:0 0 8px;font-size:15px;line-height:1.5\"><strong>Propõe:<\u002Fstrong> tempo integral priorizado onde há mais vulnerabilidade e apoio para vestibulares e olimpíadas.<\u002Fp><p style=\"margin:0;font-size:15px;line-height:1.5\"><strong>Depende de:<\u002Fstrong> o seu município ou estado receber vagas e infraestrutura.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 250px;min-width:0;background:#fff;border:3px solid #1F2A44;border-radius:20px;overflow:hidden\">\n<svg sc-camel-view-box=\"0 0 250 150\" role=\"img\" aria-label=\"Professora Lia\" style=\"display:block;width:100%;height:auto;background:#CFF1EC\"><g class=\"bob\"><use href=\"#lia\" transform=\"translate(65 14) scale(.9)\"><\u002Fuse><\u002Fg><\u002Fsvg>\n<div style=\"padding:16px\"><h3 style=\"margin:0 0 8px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px\">Professores<\u002Fh3><p style=\"margin:0 0 8px;font-size:15px;line-height:1.5\"><strong>Propõe:<\u002Fstrong> formação continuada, carreira ligada a indicadores e adicionais de produtividade.<\u002Fp><p style=\"margin:0;font-size:15px;line-height:1.5\"><strong>Depende de:<\u002Fstrong> como os indicadores serão definidos. O piso nacional já vale hoje.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1 1 250px;min-width:0;background:#fff;border:3px solid #1F2A44;border-radius:20px;overflow:hidden\">\n<svg sc-camel-view-box=\"0 0 250 150\" role=\"img\" aria-label=\"Bit, o robô, representando cidadãos digitais\" style=\"display:block;width:100%;height:auto;background:#D7DDFF\"><g class=\"bob\"><use href=\"#bit\" transform=\"translate(65 14) scale(.9)\"><\u002Fuse><\u002Fg><\u002Fsvg>\n<div style=\"padding:16px\"><h3 style=\"margin:0 0 8px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px\">Cidadãos digitais<\u002Fh3><p style=\"margin:0 0 8px;font-size:15px;line-height:1.5\"><strong>Propõe:<\u002Fstrong> formar pessoas capazes de fiscalizar gastos públicos e checar fontes de informação.<\u002Fp><p style=\"margin:0;font-size:15px;line-height:1.5\"><strong>Depende de:<\u002Fstrong> o conteúdo chegar de fato às salas de aula.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"mitos\" style=\"padding:48px 24px\">\n<div style=\"max-width:1160px;margin:0 auto\">\n<h2 style=\"margin:0 0 6px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:38px\">Mito ou fato?<\u002Fh2>\n<p style=\"margin:0 0 24px;font-size:18px;line-height:1.5\">Clique em uma frase para ver a resposta.<\u002Fp>\n<div style=\"display:flex;flex-direction:column;gap:14px\">\n<sc-for list=\"{{myths}}\" as=\"m\" hint-placeholder-count=\"4\">\n<div style=\"background:#fff;border:3px solid #1F2A44;border-radius:18px;overflow:hidden\">\n<button sc-camel-on-click=\"{{m.toggle}}\" aria-expanded=\"{{m.expanded}}\" style=\"width:100%;text-align:left;background:#FFF;border:0;padding:16px 20px;font-size:18px;font-weight:800;color:#1F2A44;min-height:44px\">{{m.q}}<\u002Fbutton>\n<sc-if value=\"{{m.open}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"padding:14px 20px 18px;background:{{m.bg}};border-top:3px solid #1F2A44;font-size:16px;line-height:1.55\"><strong>{{m.verdict}}<\u002Fstrong> {{m.a}}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"texto\" style=\"padding:48px 24px;background:#1F2A44;color:#fff\">\n<div style=\"max-width:900px;margin:0 auto\">\n<h2 style=\"margin:0 0 6px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:38px\">Leia o texto original<\u002Fh2>\n<p style=\"margin:0 0 20px;font-size:18px;line-height:1.5;color:#E6EAF5\">Versão apenas para leitura, em 4 páginas. O número do projeto está em branco porque ainda é um rascunho.<\u002Fp>\n<div sc-camel-on-context-menu=\"{{block}}\" style=\"height:680px;overflow-y:auto;background:#3A4568;border:4px solid #FFC93C;border-radius:12px;padding:16px;user-select:none;-webkit-user-select:none\">\n<img src=\"7d7d50c1-2e7a-4556-a843-1b8ca8105ebb\" alt=\"Página 1 do projeto de lei: ementa, Capítulo I e início do Capítulo II\" draggable=\"false\" style=\"display:block;width:100%;height:auto;margin-bottom:16px;background:#fff;pointer-events:none\">\n<img src=\"eea94258-6df4-4116-be3e-0592a10152e5\" alt=\"Página 2 do projeto de lei: Capítulos II e III\" draggable=\"false\" style=\"display:block;width:100%;height:auto;margin-bottom:16px;background:#fff;pointer-events:none\">\n<img src=\"824e9bb3-9007-4e73-ba49-d0efc3413a30\" alt=\"Página 3 do projeto de lei: Capítulos IV e V e justificativa\" draggable=\"false\" style=\"display:block;width:100%;height:auto;margin-bottom:16px;background:#fff;pointer-events:none\">\n<img src=\"62c3cf65-ff4c-4f76-be6f-4aff32326a9f\" alt=\"Página 4 do projeto de lei: quadro de estrutura e eixos\" draggable=\"false\" style=\"display:block;width:100%;height:auto;background:#fff;pointer-events:none\">\n<\u002Fdiv>\n<p style=\"margin:12px 0 0;font-size:14px;color:#C9D0E6\">Role dentro do quadro para ler as páginas.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"plenario\" style=\"padding:48px 24px\">\n<div style=\"max-width:1160px;margin:0 auto\">\n<h2 style=\"margin:0 0 6px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:38px\">Antes de levar a um plenário: 5 perguntas<\u002Fh2>\n<p style=\"margin:0 0 24px;font-size:18px;line-height:1.5;max-width:780px\">Um parlamentar de qualquer casa legislativa provavelmente vai perguntar isto. Ter respostas prontas fortalece a proposta. É orientação geral, não substitui a assessoria jurídica.<\u002Fp>\n<ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px\">\n<li style=\"background:#fff;border:3px solid #1F2A44;border-radius:18px;padding:18px 20px\"><strong style=\"font-size:18px\">1. Quem paga?<\u002Fstrong><div style=\"margin-top:6px;font-size:16px;line-height:1.55\">O texto não traz estimativa de impacto orçamentário, e propostas que criam despesa costumam precisar dela. Vale ligar o projeto às metas de financiamento do novo PNE, que prevê chegar a 7,5% do PIB no sétimo ano e 10% ao final.<\u002Fdiv><\u002Fli>\n<li style=\"background:#fff;border:3px solid #1F2A44;border-radius:18px;padding:18px 20px\"><strong style=\"font-size:18px\">2. Qual é o veículo legislativo?<\u002Fstrong><div style=\"margin-top:6px;font-size:16px;line-height:1.55\">O projeto altera a LDB, e a Constituição dá à União a competência privativa para legislar sobre diretrizes e bases da educação (art. 22, XXIV). Em uma assembleia ou câmara municipal, a ideia pode precisar virar lei sobre a própria rede de ensino ou uma indicação ao Executivo ou ao Congresso.<\u002Fdiv><\u002Fli>\n<li style=\"background:#fff;border:3px solid #1F2A44;border-radius:18px;padding:18px 20px\"><strong style=\"font-size:18px\">3. Quem tem a iniciativa?<\u002Fstrong><div style=\"margin-top:6px;font-size:16px;line-height:1.55\">Temas como carreira e remuneração de servidores costumam ter iniciativa reservada ao Executivo. Confirme com a consultoria legislativa da casa.<\u002Fdiv><\u002Fli>\n<li style=\"background:#fff;border:3px solid #1F2A44;border-radius:18px;padding:18px 20px\"><strong style=\"font-size:18px\">4. Como se encaixa no PNE?<\u002Fstrong><div style=\"margin-top:6px;font-size:16px;line-height:1.55\">Mostre a ligação com tempo integral, valorização docente e educação digital, que já têm base em lei vigente.<\u002Fdiv><\u002Fli>\n<li style=\"background:#fff;border:3px solid #1F2A44;border-radius:18px;padding:18px 20px\"><strong style=\"font-size:18px\">5. Como medir o resultado?<\u002Fstrong><div style=\"margin-top:6px;font-size:16px;line-height:1.55\">Defina indicadores desde o início: matrículas em tempo integral, participação de estudantes de baixa renda em olimpíadas, formação docente concluída.<\u002Fdiv><\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fsection>\n\n<footer id=\"fontes\" style=\"padding:36px 24px;background:#FFC93C;border-top:3px solid #1F2A44\">\n<div style=\"max-width:1160px;margin:0 auto;font-size:15px;line-height:1.6\">\n<div style=\"font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;margin-bottom:8px\">Fontes e aviso<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:12px\">\n<a href=\"http://legislacao.planalto.gov.br/legisla/legislacao.nsf/Viw_Identificacao/lei%209.394-1996?OpenDocument\" target=\"_blank\" rel=\"noopener\" style=\"color:#1F2A44\">LDB (Lei 9.394/1996)<\u002Fa>\n<a href=\"https://ri.ufs.br/bitstream/riufs/9391/46/45.pdf\" target=\"_blank\" rel=\"noopener\" style=\"color:#1F2A44\">Princípios na CF e na LDB (UFS)<\u002Fa>\n<a href=\"https://legis.senado.leg.br/norma/36763658\" target=\"_blank\" rel=\"noopener\" style=\"color:#1F2A44\">Lei 14.533/2023 (Educação Digital)<\u002Fa>\n<a href=\"https://www.planalto.gov.br/CCIVIL_03/_Ato2023-2026/2023/Lei/L14640.htm\" target=\"_blank\" rel=\"noopener\" style=\"color:#1F2A44\">Lei 14.640/2023 (Tempo Integral)<\u002Fa>\n<a href=\"https://www12.senado.leg.br/noticias/materias/2026/04/15/novo-plano-nacional-de-educacao-e-sancionado-e-entra-em-vigor\" target=\"_blank\" rel=\"noopener\" style=\"color:#1F2A44\">Novo PNE, Lei 15.388/2026 (Senado)<\u002Fa>\n<a href=\"https://www.poder360.com.br/poder-educacao/como-e-e-como-fica-a-educacao-com-o-novo-pne/\" target=\"_blank\" rel=\"noopener\" style=\"color:#1F2A44\">Metas do novo PNE (Poder360)<\u002Fa>\n<a href=\"https://tribunadoplanalto.com.br/governo-sanciona-novo-piso-de-r-51-mil-para-professores-da-educacao-basica/\" target=\"_blank\" rel=\"noopener\" style=\"color:#1F2A44\">Piso do magistério, Lei 15.437/2026<\u002Fa>\n<a href=\"https://repositorio.ifb.edu.br/bitstreams/c22bc034-1ca1-4180-b758-d5b066454290/download\" target=\"_blank\" rel=\"noopener\" style=\"color:#1F2A44\">Lei de Acesso à Informação e Portal da Transparência<\u002Fa>\n<\u002Fdiv>\n<div>Material educativo e informativo, com dados conferidos em outubro de 2026. Os personagens são fictícios. O projeto de lei apresentado aqui é um rascunho sem número e não tem força de lei. Este conteúdo não é aconselhamento jurídico.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:7000}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { open: {} };\n  }\n  say(lines) {\n    try {\n      const s = window.speechSynthesis;\n      if (!s) return;\n      s.cancel();\n      const voices = s.getVoices();\n      const v = voices.find((x) => /pt[-_]BR/i.test(x.lang)) || voices.find((x) => /^pt/i.test(x.lang));\n      const P = { lia: [1.15, 1], ze: [0.8, 0.95], duda: [1.5, 1.05], bit: [0.6, 0.95] };\n      lines.forEach((l) => {\n        const u = new SpeechSynthesisUtterance(l.text);\n        u.lang = 'pt-BR';\n        if (v) u.voice = v;\n        u.pitch = P[l.who][0];\n        u.rate = P[l.who][1];\n        s.speak(u);\n      });\n    } catch (err) {}\n  }\n  stopSpeech() {\n    try { window.speechSynthesis.cancel(); } catch (err) {}\n  }\n  renderVals() {\n    const open = this.state.open;\n    const WHO = {\n      lia: { name: 'Profa. Lia', tagBg: '#1FA6A0', tagFg: '#10263A' },\n      ze: { name: 'Seu Zé', tagBg: '#FF6B57', tagFg: '#1F2A44' },\n      duda: { name: 'Duda', tagBg: '#FFC93C', tagFg: '#1F2A44' },\n      bit: { name: 'Bit, o robô', tagBg: '#3D5AFE', tagFg: '#FFFFFF' }\n    };\n    const TINTS = ['#FFE9A8', '#CFF1EC', '#FFD3CC', '#D7DDFF'];\n    const EPISODES = [\n      { name: 'O cidadão é o chefe', cap: 'Capítulo I · Arts. 1º e 2º', lines: [\n        ['lia', 'Pessoal, o projeto parte de uma ideia simples: o cidadão é o titular do poder, e a administração pública é quem presta o serviço.'],\n        ['ze', 'Então quem trabalha no governo trabalha para mim?'],\n        ['lia', 'Isso! E o serviço precisa seguir cinco princípios da Constituição: Legalidade, Impessoalidade, Moralidade, Publicidade e Eficiência. O famoso L-I-M-P-E.'],\n        ['duda', 'E na escola? O projeto diz que escola não é palanque: nada de propaganda político-ideológica nem culto a político. A LDB já garante o pluralismo de ideias.']\n      ] },\n      { name: 'Para onde vai o dinheiro público', cap: 'Capítulo II · Arts. 3º e 4º', lines: [\n        ['bit', 'Bip! Todo imposto que você paga entra no orçamento público, e de lá vai para serviços como a escola.'],\n        ['lia', 'O projeto quer que a escola ensine esse caminho: arrecadação, orçamento e execução, e também como a sociedade fiscaliza.'],\n        ['duda', 'E como eu confiro se gastaram direito?'],\n        ['bit', 'Pela Lei de Acesso à Informação e pelos portais da transparência, que já existem. E antes de compartilhar uma notícia, cheque a fonte: o projeto quer treinar isso.']\n      ] },\n      { name: 'Escola o dia todo e alto rendimento', cap: 'Capítulo III · Arts. 5º a 6º-C', lines: [\n        ['duda', 'Minha escola vai ficar aberta o dia todo?'],\n        ['lia', 'O projeto manda expandir o tempo integral, começando pelas regiões mais vulneráveis. Isso conversa com o Programa Escola em Tempo Integral, de 2023, e com o novo PNE.'],\n        ['ze', 'E meu neto, de família sem muito dinheiro, tem vez nas olimpíadas?'],\n        ['lia', 'Para isso existe a proposta do PSAR-BR: material didático, tutoria e isenção de taxas em vestibulares e olimpíadas, mais vagas de iniciação científica júnior.']\n      ] },\n      { name: 'Professor sempre atualizado', cap: 'Capítulo IV · Arts. 7º a 10', lines: [\n        ['lia', 'Mestrado e doutorado contam, mas o projeto diz que aprender não termina no diploma: é a Atualização Docente Contínua.'],\n        ['ze', 'E o salário do professor?'],\n        ['lia', 'O projeto fala em remuneração compatível e carreira ligada a indicadores de aprendizagem. O piso nacional já existe: R$ 5.130,63 por 40 horas em 2026.'],\n        ['lia', 'Os módulos de reciclagem seriam obrigatórios, e haveria adicionais para quem liderar programas de alto desempenho. Esse é um dos pontos que mais pedem debate.']\n      ] },\n      { name: 'Todo mundo junto', cap: 'Capítulo V · Arts. 11 e 12', lines: [\n        ['bit', 'Quem faz isso acontecer? União, Estados, Distrito Federal e Municípios, trabalhando juntos, em regime de colaboração.'],\n        ['ze', 'E quando começa?'],\n        ['duda', 'Então já virou lei?'],\n        ['lia', 'Ainda não! O texto entra em vigor na publicação, com implementação progressiva seguindo o PNE. Mas hoje é só um projeto, sem número: precisa ser votado pelo Legislativo e sancionado.']\n      ] }\n    ];\n    const mk = (l, bg) => ({\n      who: l[0], text: l[1], name: WHO[l[0]].name, tagBg: WHO[l[0]].tagBg, tagFg: WHO[l[0]].tagFg, bg: bg,\n      isLia: l[0] === 'lia', isZe: l[0] === 'ze', isDuda: l[0] === 'duda', isBit: l[0] === 'bit'\n    });\n    const eps = EPISODES.map((E, i) => ({\n      num: i + 1, name: E.name, cap: E.cap,\n      ep0: i === 0, ep1: i === 1, ep2: i === 2, ep3: i === 3, ep4: i === 4,\n      first: mk(E.lines[0], '#FFF3D1'),\n      small: [mk(E.lines[1], TINTS[0]), mk(E.lines[2], TINTS[1]), mk(E.lines[3], TINTS[2])]\n    }));\n\n    eps.forEach((ep) => {\n      const all = [ep.first].concat(ep.small);\n      ep.first.speak = () => this.say([ep.first]);\n      ep.small.forEach((p) => { p.speak = () => this.say([p]); });\n      ep.play = () => this.say(all);\n      ep.stop = () => this.stopSpeech();\n    });\n\n    const chapters = [\n      { num: 1, title: 'Princípios e neutralidade', arts: 'Arts. 1º e 2º', shadow: '6px 6px 0 #FFC93C',\n        hoje: 'A Constituição (art. 206) e a LDB (art. 3º) já listam o pluralismo de ideias e de concepções pedagógicas, a gestão democrática e a valorização dos profissionais da educação entre os princípios do ensino.',\n        propoe: 'Reforça a neutralidade pedagógica e proíbe usar escolas para proselitismo político-ideológico ou culto de personalidade de agentes públicos. Coloca o cidadão como titular do poder e a administração como prestadora de serviço.',\n        apoia: 'protege o estudante de pressões ideológicas e reforça a impessoalidade no serviço público.',\n        questiona: 'o texto não define “neutralidade”. Sem critérios claros, professores podem ficar inseguros para tratar de temas atuais, e o pluralismo já é princípio da LDB.',\n        sources: [{ label: 'LDB (Planalto)', url: 'http://legislacao.planalto.gov.br/legisla/legislacao.nsf/Viw_Identificacao/lei%209.394-1996?OpenDocument' }, { label: 'Princípios na CF e na LDB (UFS)', url: 'https://ri.ufs.br/bitstream/riufs/9391/46/45.pdf' }] },\n      { num: 2, title: 'Inteligência cívica e mídia', arts: 'Arts. 3º e 4º', shadow: '6px 6px 0 #1FA6A0',\n        hoje: 'A Lei 14.533/2023 (Política Nacional de Educação Digital) alterou a LDB para incluir a educação digital e tratou a educação midiática como conteúdo transversal. A Lei de Acesso à Informação (12.527/2011) e os portais da transparência já permitem consultar gastos públicos.',\n        propoe: 'Inclui no currículo conteúdos práticos sobre a estrutura do Estado, tributos, execução do orçamento, controle social e acesso à Justiça, além de análise de dados e verificação de fontes.',\n        apoia: 'ensina o jovem a usar ferramentas de transparência que já existem e a se proteger da desinformação.',\n        questiona: 'em qual disciplina e com qual carga horária? Quem vai formar os professores para ensinar finanças públicas de forma prática?',\n        sources: [{ label: 'Lei 14.533/2023 (Senado)', url: 'https://legis.senado.leg.br/norma/36763658' }, { label: 'LAI e Portal da Transparência', url: 'https://repositorio.ifb.edu.br/bitstreams/c22bc034-1ca1-4180-b758-d5b066454290/download' }] },\n      { num: 3, title: 'Tempo integral e alto rendimento', arts: 'Arts. 5º a 6º-C', shadow: '6px 6px 0 #FF6B57',\n        hoje: 'A Lei 14.640/2023 criou o Programa Escola em Tempo Integral, com apoio técnico e financeiro para criar matrículas. O novo PNE (Lei 15.388/2026) eleva a meta para 65% das escolas públicas e metade dos estudantes, com jornada mínima de 7 horas.',\n        propoe: 'Expande o tempo integral priorizando regiões vulneráveis, garante ensino voltado ao alto rendimento (olimpíadas e exames de seleção) e cria o PSAR-BR, com material, tutoria e isenção de taxas para baixa renda. Prevê vagas de iniciação científica júnior.',\n        apoia: 'leva oportunidades de ponta a quem hoje tem menos acesso e dá prioridade territorial a quem mais precisa.',\n        questiona: 'o texto não indica fonte de recursos, metas numéricas nem prazos. O foco em olimpíadas pode competir com a prioridade de alfabetização e aprendizagem básica.',\n        sources: [{ label: 'Lei 14.640/2023 (Planalto)', url: 'https://www.planalto.gov.br/CCIVIL_03/_Ato2023-2026/2023/Lei/L14640.htm' }, { label: 'Metas do novo PNE (Poder360)', url: 'https://www.poder360.com.br/poder-educacao/como-e-e-como-fica-a-educacao-com-o-novo-pne/' }] },\n      { num: 4, title: 'Estatuto da eficiência docente', arts: 'Arts. 7º a 10', shadow: '6px 6px 0 #3D5AFE',\n        hoje: 'O piso nacional do magistério já existe (Lei 11.738/2008). Em 2026, a Lei 15.437 fixou R$ 5.130,63 para 40 horas semanais, com reajuste de 5,4%, e incluiu os contratados temporários. Estados e municípios têm até o início do ano letivo de 2027 para se adequar.',\n        propoe: 'Prevê remuneração compatível com a função e carreira atrelada a indicadores de aprendizagem. Diz que a pós-graduação não encerra o dever de atualização, institui módulos periódicos e obrigatórios de reciclagem e adicionais de produtividade para quem liderar programas de alto desempenho.',\n        apoia: 'valoriza quem se atualiza e premia quem lidera projetos de inovação.',\n        questiona: 'reciclagem obrigatória e bônus por desempenho exigem orçamento, tempo de formação e indicadores bem desenhados. Sem isso, podem aumentar a sobrecarga e a desigualdade entre escolas.',\n        sources: [{ label: 'Piso do magistério 2026', url: 'https://tribunadoplanalto.com.br/governo-sanciona-novo-piso-de-r-51-mil-para-professores-da-educacao-basica/' }] },\n      { num: 5, title: 'Regime de colaboração', arts: 'Arts. 11 e 12', shadow: '6px 6px 0 #8FD08A',\n        hoje: 'A divisão de tarefas entre União, estados e municípios já aparece na LDB, e o novo PNE obriga estados, Distrito Federal e municípios a elaborar ou adequar seus planos decenais.',\n        propoe: 'Determina a implementação progressiva em regime de colaboração, observando as metas e estratégias do PNE, com vigência a partir da publicação.',\n        apoia: 'respeita o pacto federativo e se encaixa no plano nacional já em vigor.',\n        questiona: '“progressiva” sem cronograma pode ficar só no papel, e cada ente precisará de recursos próprios.',\n        sources: [{ label: 'Novo PNE sancionado (Senado)', url: 'https://www12.senado.leg.br/noticias/materias/2026/04/15/novo-plano-nacional-de-educacao-e-sancionado-e-entra-em-vigor' }] }\n    ];\n\n    const MYTHS = [\n      { q: 'Esse projeto já é lei.', verdict: 'Mito.', a: 'É um rascunho, com número em branco. Para virar lei precisa ser apresentado, votado pelo Legislativo e sancionado.', bg: '#FFD3CC' },\n      { q: 'O projeto cria o piso salarial dos professores.', verdict: 'Mito.', a: 'O piso nacional existe desde a Lei 11.738/2008. Em 2026 ele é de R$ 5.130,63 para 40 horas semanais. O projeto fala em remuneração compatível e carreira ligada a indicadores.', bg: '#FFD3CC' },\n      { q: 'Se aprovado, a escola passaria a ensinar como o dinheiro público é arrecadado e gasto.', verdict: 'Fato.', a: 'O Art. 3º manda incluir nos currículos a estrutura do Estado, a arrecadação tributária, a execução do orçamento e os instrumentos de controle social.', bg: '#CFF1EC' },\n      { q: 'O projeto propõe isenção de taxas de vestibular para estudantes de baixa renda.', verdict: 'Fato.', a: 'O Art. 6º-B cria o PSAR-BR, que prevê isenção de taxas em exames de seleção, vestibulares de alta complexidade e olimpíadas, além de material didático e tutoria.', bg: '#CFF1EC' }\n    ];\n    const myths = MYTHS.map((m, i) => ({\n      q: m.q, verdict: m.verdict, a: m.a, bg: m.bg,\n      open: !!open[i], expanded: !!open[i],\n      toggle: () => this.setState({ open: { ...this.state.open, [i]: !this.state.open[i] } })\n    }));\n\n    return { eps: eps, chapters: chapters, myths: myths, block: (e) => { e.preventDefault(); } };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
